<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Slowpoke Ears -->
  <rect x="2" y="2" width="2" height="3" fill="#ff7aa2" />
  <rect x="12" y="2" width="2" height="3" fill="#ff7aa2" />
  <rect x="2" y="2" width="1" height="1" fill="#7c264c" />
  <rect x="13" y="2" width="1" height="1" fill="#7c264c" />

  <!-- Head Base -->
  <rect x="3" y="3" width="10" height="6" fill="#ff9ebb" />
  <rect x="4" y="2" width="8" height="1" fill="#ff9ebb" />
  <rect x="2" y="5" width="1" height="3" fill="#ff9ebb" />
  <rect x="13" y="5" width="1" height="3" fill="#ff9ebb" />

  <!-- Dopey Wide Eyes -->
  <rect x="4" y="5" width="2" height="2" fill="#ffffff" />
  <rect x="10" y="5" width="2" height="2" fill="#ffffff" />
  <rect x="5" y="6" width="1" height="1" fill="#1a0e2a" />
  <rect x="10" y="6" width="1" height="1" fill="#1a0e2a" />

  <!-- Cream Snout / Muzzle -->
  <rect x="5" y="7" width="6" height="3" fill="#fff1c5" />
  <rect x="6" y="10" width="4" height="1" fill="#fff1c5" />

  <!-- Dopey Mouth & Nostrils -->
  <rect x="6" y="7" width="1" height="1" fill="#d8a0b0" />
  <rect x="9" y="7" width="1" height="1" fill="#d8a0b0" />
  <rect x="7" y="8" width="2" height="1" fill="#7c264c" />

  <!-- Lower Body & Paws -->
  <rect x="3" y="9" width="2" height="4" fill="#ff7aa2" />
  <rect x="11" y="9" width="2" height="4" fill="#ff7aa2" />
  <rect x="4" y="11" width="8" height="3" fill="#ff9ebb" />
  <rect x="3" y="13" width="2" height="2" fill="#fff1c5" />
  <rect x="11" y="13" width="2" height="2" fill="#fff1c5" />

  <!-- Outline Base -->
  <rect x="3" y="15" width="10" height="1" fill="#7c264c" />
</svg>
